<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/form.css"/>
    
    
</head>
<body>
    <main>
    <div class="container">
        <div class="box" style="background-color: lightblue;">
            <h1 id="header">My Blog App!</h1>
            <h2 id="header2">...keep track of your thoughts...</h2>
        </div>
        <div class="box" style="background-color: lightgreen;">
            <h2>Whats on your mind?</h2>
            <form id="blog-form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter your Username..." required><br><br>

                <label for="title">Blog Title:</label>
                <input type="text" id="title" name="title" placeholder="Enter a Title..." required><br><br>

                <label for="content">Blog Entry:</label>
                <textarea type="text" id="content" name="content" placeholder="Type your thoughts here..." required></textarea><br><br>

                <button type="submit" id="submitButton">Submit</button>
            </form>
        </div>
        <div id="form-message"></div>
    </div>
    </main>
    <script type="text/javascript" src="assets/js/form.js"></script>
    
</body>
</html>
